<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Match day</title>
<link rel="stylesheet" href="../assets/theme.css">
<style></style>
</head><body>
<div class="frame story bg-b">

<div class="moonwrap" style="width:1000px;height:1000px;position:absolute;left:40px;top:-120px;opacity:.9"><img class="ghost" src="../assets/moon-mark.png" alt=""><img class="lit mark" src="../assets/moon-mark.png" style="" alt="MoonPadel moon mark"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,0) 30%,rgba(5,7,15,.9) 55%)"></div>
<div class="pad" style="justify-content:flex-end">
  <div class="eyebrow">Match day</div>
  <div class="h1" style="font-size:170px;margin-top:20px">Tonight<br>we <span class="blue">play</span></div>
  <div class="card" style="margin-top:40px;padding:36px 44px">
    <div class="row" style="gap:20px"><span class="tag venue">Venue</span><span class="mont" style="font-weight:700;font-size:38px"><span class="ph">[VENUE]</span></span></div>
    <div class="row" style="gap:20px;margin-top:20px"><span class="tag web">First serve</span><span class="mont" style="font-weight:700;font-size:38px"><span class="ph">[TIME]</span></span></div>
    <div class="row" style="gap:20px;margin-top:20px"><span class="tag" style="color:var(--gold);border:2px solid rgba(242,193,78,.6)">Reveal</span><span class="mont" style="font-weight:700;font-size:38px">around <span class="ph">[TIME]</span></span></div>
  </div>
  <div class="lead" style="margin-top:30px">Not playing? Come and watch the podium reveal.</div>
</div>
</div>
</body></html>
