# Netlify site for the league platform (separate from the static site in /site).
# In Netlify: Add new site > Import from Git > this repo, Base directory = platform.
# The Next.js runtime plugin below turns pages, API routes and middleware into Netlify Functions.
[build]
  command = "node scripts/check-db-url.mjs; npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pre-sized moon mark files never change in place (a new artwork gets new names).
[[headers]]
  for = "/brand/mark/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
