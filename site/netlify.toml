# Netlify config for the Moon Padel site. On Hostinger, .htaccess does the same job.
# This file sits in the publish folder so drag-and-drop deploys (Netlify Drop) pick it up too.
# For Git deploys, the repo-root netlify.toml points Netlify at this folder.

[build]
  publish = "."

# Pretty URLs: /events serves events.html (Netlify does this by default; kept explicit).
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Keeps search engines away while the site still has [placeholders].
    # Delete this line at launch (tools/build_site.py --launch does it for you).
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
